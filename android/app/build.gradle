plugins {
    id 'com.android.application'
}

// Las claves de firma se leen del entorno de CI; nunca del repositorio.
def releaseKeystorePath = System.getenv('SCANTEC_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('SCANTEC_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('SCANTEC_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SCANTEC_KEY_PASSWORD')

android {
    namespace 'ar.com.scantec.diagnostico'
    compileSdk 35

    defaultConfig {
        applicationId 'ar.com.scantec.diagnostico'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        if (releaseKeystorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
