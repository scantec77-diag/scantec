plugins {
    id 'com.android.application'
}

android {
    namespace 'ar.com.scantec.diagnostico'
    compileSdk 35

    defaultConfig {
        applicationId 'ar.com.scantec.diagnostico'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
