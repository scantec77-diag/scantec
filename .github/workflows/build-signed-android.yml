name: Compilar APK Scantec firmada

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCANTEC_KEYSTORE_BASE64: ${{ secrets.SCANTEC_KEYSTORE_BASE64 }}
      SCANTEC_KEYSTORE_PASSWORD: ${{ secrets.SCANTEC_KEYSTORE_PASSWORD }}
      SCANTEC_KEY_ALIAS: ${{ secrets.SCANTEC_KEY_ALIAS }}
      SCANTEC_KEY_PASSWORD: ${{ secrets.SCANTEC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Preparar clave de firma privada
        shell: bash
        run: |
          for name in SCANTEC_KEYSTORE_BASE64 SCANTEC_KEYSTORE_PASSWORD SCANTEC_KEY_ALIAS SCANTEC_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar el secreto $name en GitHub Actions"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$SCANTEC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scantec-release.jks"
          echo "SCANTEC_KEYSTORE_PATH=$RUNNER_TEMP/scantec-release.jks" >> "$GITHUB_ENV"
      - name: Compilar version de distribucion firmada
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verificar firma digital de la APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Guardar APK firmada para descarga
        uses: actions/upload-artifact@v4
        with:
          name: Scantec-APK-Firmada
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
