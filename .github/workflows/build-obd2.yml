name: Compilar APK Scantec OBD-II ELM327
on:
  push:
    branches:
      - "codex/obd2-elm-poc-20261029"
    paths:
      - "obd2-android/**"
      - ".github/workflows/build-obd2.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Reutilizar firma de prueba para permitir actualizaciones
        uses: actions/cache@v4
        with:
          path: ~/.android/scantec-obd2-test.keystore
          key: scantec-obd2-debug-signing-v1
      - name: Crear firma de prueba si todavía no existe
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/scantec-obd2-test.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/scantec-obd2-test.keystore" -storepass "scantec-obd2-test" -keypass "scantec-obd2-test" -alias "scantec-obd2-test" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Scantec OBD Test, O=Scantec 77, C=AR"
          fi
      - name: Comprobar SDK de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true
      - name: Versionar APK de prueba
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: sed -i "s/versionCode 1/versionCode ${APP_VERSION_CODE}/" obd2-android/app/build.gradle
      - name: Construir APK de pruebas
        run: gradle -p obd2-android assembleDebug --no-daemon --stacktrace
      - name: Guardar APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: Scantec-OBD2-ELM327-APK
          path: obd2-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
